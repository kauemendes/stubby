{{- if eq .Values.tls.mode "self-signed" -}}
{{- /*
The TLS bootstrap Job runs as a pre-install/pre-upgrade hook (weight -5).
It needs its ServiceAccount, Role, RoleBinding, ClusterRole, and
ClusterRoleBinding to exist BEFORE it tries to schedule — otherwise the
API server refuses to create the pod ("serviceaccount … not found").
Mark each piece as a hook with a smaller weight so Helm applies them
first. `before-hook-creation` keeps them around across upgrades while
still recreating them cleanly on the next release.
*/ -}}
{{- $hookAnno := dict
    "helm.sh/hook" "pre-install,pre-upgrade"
    "helm.sh/hook-weight" "-10"
    "helm.sh/hook-delete-policy" "before-hook-creation" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stubby.fullname" . }}-tls
  labels: {{- include "stubby.labels" . | nindent 4 }}
  annotations: {{- toYaml $hookAnno | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "stubby.fullname" . }}-tls
  labels: {{- include "stubby.labels" . | nindent 4 }}
  annotations: {{- toYaml $hookAnno | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "stubby.fullname" . }}-tls
  labels: {{- include "stubby.labels" . | nindent 4 }}
  annotations: {{- toYaml $hookAnno | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "stubby.fullname" . }}-tls
subjects:
  - kind: ServiceAccount
    name: {{ include "stubby.fullname" . }}-tls
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stubby.fullname" . }}-tls-cluster
  labels: {{- include "stubby.labels" . | nindent 4 }}
  annotations: {{- toYaml $hookAnno | nindent 4 }}
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    resourceNames: ["{{ include "stubby.fullname" . }}"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "stubby.fullname" . }}-tls-cluster
  labels: {{- include "stubby.labels" . | nindent 4 }}
  annotations: {{- toYaml $hookAnno | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "stubby.fullname" . }}-tls-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "stubby.fullname" . }}-tls
    namespace: {{ .Release.Namespace }}
{{- end }}
