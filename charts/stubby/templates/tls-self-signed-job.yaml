{{- if eq .Values.tls.mode "self-signed" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stubby.fullname" . }}-tls-bootstrap
  labels: {{- include "stubby.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: {{ include "stubby.fullname" . }}-tls
      restartPolicy: OnFailure
      # The bootstrap container runs as root because the alpine/openssl image
      # does not ship curl or jq, and `apk add`-ing them at runtime requires
      # writes to apk's databases (owned by root). Other hardenings stay:
      # caps=drop ALL, no privesc, seccomp=RuntimeDefault. Risk is bounded —
      # one-shot Job (TTL 300s), only API verbs are get/patch on a single
      # Secret and the MWC. This is the same trade-off cert-manager and
      # comparable bootstrap jobs make.
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: {{ .Values.tls.selfSigned.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          env:
            - { name: NAMESPACE,      value: {{ .Release.Namespace | quote }} }
            - { name: SECRET_NAME,    value: "{{ include "stubby.fullname" . }}-tls" }
            - { name: SERVICE,        value: "{{ include "stubby.fullname" . }}" }
            - { name: MWC_NAME,       value: "{{ include "stubby.fullname" . }}" }
            - { name: VALIDITY_DAYS,  value: "{{ .Values.tls.selfSigned.validityDays }}" }
          command:
            - sh
            - -c
            - |
              set -eu
              command -v curl >/dev/null || apk add --no-cache curl >/dev/null
              command -v jq   >/dev/null || apk add --no-cache jq   >/dev/null

              CN="${SERVICE}.${NAMESPACE}.svc"
              SAN_FILE=/tmp/openssl.cnf

              # Build minimal config — single [req] section with SANs.
              cat >"${SAN_FILE}" <<EOF
              [req]
              prompt = no
              distinguished_name = dn
              req_extensions = ext
              [dn]
              CN = ${CN}
              [ext]
              subjectAltName = DNS:${SERVICE}.${NAMESPACE}.svc, DNS:${SERVICE}.${NAMESPACE}.svc.cluster.local
              EOF

              cd /tmp
              openssl genrsa -out ca.key 2048
              openssl req -x509 -new -nodes -key ca.key -subj "/CN=stubby-ca" \
                -days "${VALIDITY_DAYS}" -out ca.crt
              openssl genrsa -out tls.key 2048
              openssl req -new -key tls.key -out tls.csr -config "${SAN_FILE}"
              openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
                -out tls.crt -days "${VALIDITY_DAYS}" \
                -extensions ext -extfile "${SAN_FILE}"

              CA_B64=$(base64 -w0 < ca.crt)
              CRT_B64=$(base64 -w0 < tls.crt)
              KEY_B64=$(base64 -w0 < tls.key)

              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              API=https://kubernetes.default.svc

              # Upsert TLS Secret. Try strategic-merge PATCH first (idempotent
              # for an existing Secret); if it 404s, POST to create it.
              SECRET_BODY=$(jq -n --arg c "${CRT_B64}" --arg k "${KEY_B64}" \
                '{type:"kubernetes.io/tls", data:{"tls.crt":$c,"tls.key":$k}}')
              if ! curl -fsSk --cacert "${CACERT}" -H "Authorization: Bearer ${TOKEN}" \
                   -H "Content-Type: application/strategic-merge-patch+json" \
                   -X PATCH "${API}/api/v1/namespaces/${NAMESPACE}/secrets/${SECRET_NAME}" \
                   -d "${SECRET_BODY}" > /dev/null; then
                CREATE_BODY=$(jq -n --arg n "${SECRET_NAME}" --arg c "${CRT_B64}" --arg k "${KEY_B64}" \
                  '{apiVersion:"v1", kind:"Secret", metadata:{name:$n}, type:"kubernetes.io/tls", data:{"tls.crt":$c, "tls.key":$k}}')
                curl -fsSk --cacert "${CACERT}" -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -X POST "${API}/api/v1/namespaces/${NAMESPACE}/secrets" \
                  -d "${CREATE_BODY}" > /dev/null
              fi

              # Patch MutatingWebhookConfiguration.webhooks[0].clientConfig.caBundle
              curl -fsSk --cacert "${CACERT}" -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json-patch+json" \
                -X PATCH "${API}/apis/admissionregistration.k8s.io/v1/mutatingwebhookconfigurations/${MWC_NAME}" \
                -d "[{\"op\":\"replace\",\"path\":\"/webhooks/0/clientConfig/caBundle\",\"value\":\"${CA_B64}\"}]" \
                > /dev/null

              echo "stubby: TLS bootstrap complete for ${SERVICE}.${NAMESPACE}.svc"
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
