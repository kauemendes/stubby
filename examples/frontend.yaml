apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
      annotations:
        stubby.io/type: frontend
        stubby.io/app-name: "Storefront"
        # The dummy images run as non-root; 8080 avoids needing
        # NET_BIND_SERVICE. The Service maps :80 -> targetPort http.
        stubby.io/port: "8080"
    spec:
      containers:
        - name: site
          image: ghcr.io/example/storefront:notbuilt
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: http
