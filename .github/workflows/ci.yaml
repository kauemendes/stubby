name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt + clippy + test + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: install cargo-llvm-cov
        # Pinned: 0.6.21 is the last release with MSRV 1.81; 0.6.22+ require rustc 1.87.
        run: cargo install cargo-llvm-cov --locked --version 0.6.21
      - name: cargo llvm-cov (webhook >= 80%)
        run: cargo llvm-cov --package stubby-webhook --fail-under-lines 80

  helm:
    name: Helm (lint + unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: install helm-unittest
        # Pinned: v1.1.0 introduced a plugin.yaml `platformHooks` field that breaks the
        # plugin loader on current helm releases. v1.0.3 supports `documentIndex`, which
        # is all we use.
        run: helm plugin install --version v1.0.3 https://github.com/helm-unittest/helm-unittest
      - name: helm lint
        run: helm lint charts/stubby
      - name: helm unittest
        run: helm unittest charts/stubby

  e2e:
    name: e2e (kind, k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    needs: [rust, helm]
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - v1.29.10
          - v1.30.6
          - v1.31.2
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: helm/kind-action@v1
        with:
          version: v0.24.0
          node_image: kindest/node:${{ matrix.k8s }}
          config: test/kind-config.yaml
          cluster_name: stubby-e2e
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: build + load images
        run: |
          docker build -f docker/webhook.Dockerfile        -t local/stubby-webhook:e2e        .
          docker build -f docker/dummy-backend.Dockerfile  -t local/stubby-dummy-backend:e2e  .
          docker build -f docker/dummy-frontend.Dockerfile -t local/stubby-dummy-frontend:e2e .
          kind load docker-image local/stubby-webhook:e2e        --name stubby-e2e
          kind load docker-image local/stubby-dummy-backend:e2e  --name stubby-e2e
          kind load docker-image local/stubby-dummy-frontend:e2e --name stubby-e2e
      - name: helm install + case scripts
        env:
          KEEP: "1"   # kind-action manages cluster lifecycle
        run: bash test/e2e/run.sh
