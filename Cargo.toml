[workspace]
# resolver v3 is MSRV-aware: it prefers dependency versions compatible with
# `rust-version` (1.85), so `cargo update`/Dependabot don't pull crates that
# need a newer rustc. Stable since Rust 1.84.
resolver = "3"
members = [
    "crates/webhook",
    "crates/dummy-backend",
    "crates/dummy-frontend",
    "crates/controller",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kauemendes/stubby"
authors = ["Kauê Mendes"]

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
k8s-openapi = { version = "0.23", features = ["v1_30"] }
json-patch = "2"
anyhow = "1"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
insta = { version = "1", features = ["json"] }
kube = { version = "0.96", default-features = false, features = ["client", "runtime", "rustls-tls"] }
oci-client = { version = "0.14", default-features = false, features = ["rustls-tls"] }
futures = "0.3"
base64 = "0.22"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
