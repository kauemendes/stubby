[workspace]
resolver = "2"
members = [
    "crates/webhook",
    "crates/dummy-backend",
    "crates/dummy-frontend",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kauemendes/stubby"
authors = ["Kauê Mendes"]

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
k8s-openapi = { version = "0.26", features = ["v1_30"] }
json-patch = "2"
anyhow = "1"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
insta = { version = "1", features = ["json"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
